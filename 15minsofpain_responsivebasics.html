<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-Minutes-of-Pain-Assignment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/15minsRedo.css">
</head>
<body>
    <header>
        <div class="drink-container">
            <p id="drink-name"></p>
            <img id="drink-image" src="">
            <p id="drink-instructions"></p>
        </div>
    </header>
    <!-- section 1 -->
    <section class="one">
        <h1>What is today?</h1>

        <form>
            <label for="day"> Day of the week: </label>
            <input id="day" type="text" placeholder="Day of the week">
        </form>
        <div class="button-container">
            <button id="check" type="button" name="button">Check</button>
            <button id="day-clear-button" type="button" name="button">Clear</button>
        </div>

        <h2 id="placeToSee"></h2>
    </section>
    <!-- section 2 -->
    <section class="two">
        <h1>Type in a Cocktail</h1>
        <input id="drink-input" type="text" placeholder="Type in a drink">
        <div class="button-container">
            <button id="cocktail-button" type="button" name="button">Get Cocktail</button>
            <button id="clear-button" type="button" name="button">Clear</button>
        </div>
    </section>
    <!-- section 3 -->
    <section class="three">
        <h1>Which is the best football team? </h1>
        <p class="team barca">Més que un club</p>
        <p class="team madrid">¡Hala Madrid!</p>
    </section>
    <footer>
        <img id="madrid" class="hidden" src="imgs/madridBadge.png">
    </footer>

    <script type="text/javascript" src="main.js"></script>
    
</body>
</html>
